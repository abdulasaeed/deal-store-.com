<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAL STORE</title>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;min-height:100vh;margin:0;padding:15px}
.box{background:#fff;border:2px solid #f7b500;border-radius:22px;padding:22px;width:95%;max-width:380px;text-align:center;padding-bottom:80px}
.uc{width:70px;height:70px;background:linear-gradient(#ffb700,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin:0 auto 12px;border:3px solid #000}
label{display:block;text-align:left;font-weight:bold;margin:12px 0 5px;font-size:13px}
input,select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;box-sizing:border-box}
.file-box{border:2px dashed #f7b500;border-radius:10px;padding:12px;margin:8px 0;background:#fffbe6}
.next-btn{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:90%;max-width:360px;padding:18px;background:#f7b500;border:2px solid #000;border-radius:12px;font-weight:bold;font-size:18px;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.step{display:none} .step.active{display:block}
.success{background:#e8f5e9;padding:12px;border-radius:10px;color:#2e7d32;margin-top:12px;font-weight:bold;display:none}
.preview{width:100%;max-height:100px;display:none;margin-top:5px}
</style>
</head>
<body>

<div class="box step active" id="step1">
<div class="uc">UC</div>
<h2>Payment Details</h2>
<p>Step 1 of 2</p>

<label>Package</label>
<select id="pkg"><option>325 UC - Rs 1500</option><option>660 UC - Rs 3000</option><option>1800 UC - Rs 7500</option></select>

<label>Amount (Rs)</label>
<input type="number" id="amount" value="1500">

<label>Number Jis Se Bheji</label>
<input type="tel" id="senderNum" value="03036263873">

<label>Screenshot</label>
<div class="file-box">
<input type="file" id="ss" accept="image/*" onchange="document.getElementById('p1').style.display='block'; document.getElementById('p1').src=URL.createObjectURL(this.files[0])">
<img id="p1" class="preview">
</div>
</div>

<div class="box step" id="step2">
<div class="uc">UC</div>
<h2>Transaction ID</h2>
<p>Step 2 of 2 - Last Step</p>

<label>9 Digits ID - BARA LIKHO</label>
<input id="txn" type="tel" maxlength="9" placeholder="123456789" style="font-size:32px;text-align:center;letter-spacing:8px;font-weight:bold;border:2px solid #f7b500">

<button style="width:100%;margin-top:20px;padding:18px;background:#f7b500;border-radius:12px;font-weight:bold;font-size:18px;border:2px solid #000" id="btn2" onclick="sendAll()">SUBMIT → VERIFY</button>
<div id="ok" class="success">✅ Ho gaya! Check Email</div>
</div>

<!-- FIXED NEXT BUTTON - HAMESHA NAZAR AYEGA -->
<button class="next-btn" id="nextBtn" onclick="goNext()">NEXT → Transaction ID</button>

<script>
function goNext(){
 let a=document.getElementById('amount').value;
 let s=document.getElementById('ss').files[0];
 if(!a || !s){alert('Amount aur Screenshot lazmi hai!');return;}
 document.getElementById('step1').classList.remove('active');
 document.getElementById('step2').classList.add('active');
 document.getElementById('nextBtn').style.display='none';
}
async function sendAll(){
 let pkg=document.getElementById('pkg').value;
 let amount=document.getElementById('amount').value;
 let num=document.getElementById('senderNum').value;
 let id=document.getElementById('txn').value;
 let file=document.getElementById('ss').files[0];
 if(id.length!=9){alert('9 digits ID likho');return;}
 document.getElementById('btn2').innerText='Sending...';
 let fd=new FormData();
 fd.append('_subject', `🔥 ORDER ID:${id} - Rs ${amount}`);
 fd.append('_captcha','false');
 fd.append('Package',pkg);
 fd.append('Amount',amount);
 fd.append('Number',num);
 fd.append('Transaction ID',id);
 fd.append('Screenshot',file);
 await fetch("https://formsubmit.co/uaepass499@gmail.com",{method:"POST",body:fd});
 document.getElementById('ok').style.display='block';
 document.getElementById('btn2').innerText='✅ SUBMITTED';
}
</script>
</body>
</html>
