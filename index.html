<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAL STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;padding:15px;margin:0}
.box{background:#fff;border:2px solid #f7b500;border-radius:22px;padding:22px;width:100%;max-width:380px;text-align:center}
.uc{width:75px;height:75px;background:orange;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin:0 auto 12px;border:3px solid #000}
label{display:block;text-align:left;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:10px;box-sizing:border-box}
.btn{width:100%;margin-top:14px;padding:16px;background:#f7b500;border:2px solid #000;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.step{display:none} .step.active{display:block}
.success{background:#e8f5e9;border:1px solid #4caf50;padding:12px;border-radius:10px;color:#2e7d32;margin-top:12px;font-weight:bold}
</style>
</head>
<body>

<div class="box step active" id="step1">
<div class="uc">UC</div>
<h2>Payment Verification</h2>
<label>Amount</label>
<input type="number" id="amount" value="1500">
<label>Screenshot</label>
<input type="file" id="ss" accept="image/*" style="border:2px dashed #f7b500;background:#fffbe6;padding:10px;border-radius:10px">
<button class="btn" onclick="nextStep()">VERIFY TO CHECK →</button>
</div>

<div class="box step" id="step2">
<div class="uc">UC</div>
<h2>Transaction ID</h2>
<input id="txn" type="tel" placeholder="542546585" style="font-size:40px;text-align:center;letter-spacing:8px;font-weight:900;border:3px solid #f7b500;height:80px">
<div id="ok2" class="success" style="display:none"></div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="background:#fff;flex:1" onclick="backStep()">← BACK</button>
<button class="btn" style="flex:2" id="btn2" onclick="sendTxn()">SUBMIT ID</button>
</div>
</div>

<script>
emailjs.init("M1gpuw8FX2OfMZz2-");
const SERVICE_ID = "service_m2y2j8e";
const TEMPLATE_ID = "template_2r1r6ii";

function nextStep(){
 let a=document.getElementById('amount').value;
 let f=document.getElementById('ss').files[0];
 if(!a){alert('Amount likho');return;}
 if(!f){alert('Screenshot select karo');return;}
 document.getElementById('step1').classList.remove('active');
 document.getElementById('step2').classList.add('active');
}
function backStep(){
 document.getElementById('step2').classList.remove('active');
 document.getElementById('step1').classList.add('active');
}
function sendTxn(){
 let id=document.getElementById('txn').value.trim();
 let amount=document.getElementById('amount').value;
 if(id.length<3){alert('Transaction ID likho');return;}
 let btn=document.getElementById('btn2');
 let ok=document.getElementById('ok2');
 btn.innerText='Sending...';
 emailjs.send(SERVICE_ID, TEMPLATE_ID, {
   transaction_code: id,
   amount: amount,
   to_email: "uaepass499@gmail.com",
   name: "Instagram"
 }).then(()=>{
   ok.style.display='block';
   ok.innerText="✅ "+id+" - Email bhej diya! Check inbox uaepass499@gmail.com";
   btn.innerText='SENT ✅';
 }, (err)=>{
   ok.style.display='block';
   ok.innerText="❌ Error: "+JSON.stringify(err);
   btn.innerText='TRY AGAIN';
   console.log(err);
 });
}
</script>
</body>
</html>
